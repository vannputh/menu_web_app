<footer class="bg-gradient-to-r from-gray-800 to-gray-900 text-white py-6 mt-auto">
  <div class="container mx-auto px-6">
    <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
      
      <!-- Copyright -->
      <div class="text-center md:text-left text-sm opacity-75">
        <p>&copy; {{ currentYear }} KaiXin Restaurant. All rights reserved. | Designed with ❤️ for great food experiences</p>
      </div>

      <!-- Admin Button -->
      <p-button 
        routerLink="/admin"
        routerLinkActive="admin-active"
        icon="pi pi-cog"
        label="Admin Panel"
        severity="secondary"
        [outlined]="true"
        class="admin-footer-btn">
      </p-button>
    </div>
  </div>
</footer>
