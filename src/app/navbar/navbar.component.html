<p-toolbar class="fixed top-0 left-0 w-full z-[9999] border-0 shadow-xl bg-gradient-to-r from-red-600 to-red-700">
    <div class="flex justify-between items-center w-full px-6 py-3">
        <!-- Logo and Brand Section -->
        <div class="flex items-center space-x-4">
            <img src="/logo.png" alt="KaiXin Logo" class="w-12 h-12 object-contain hover:scale-105 transition-transform duration-300">
            <div class="text-white">
                <h1 class="text-2xl font-bold tracking-wide">KaiXin</h1>
                <p class="text-xs opacity-80 font-medium">开心</p>
            </div>
        </div>

        <!-- Desktop Navigation Menu -->
        <div class="hidden md:flex items-center space-x-2">
            <a routerLink="/main-dishes" 
               routerLinkActive="navbar-active"
               class="navbar-link px-4 py-2 rounded-lg text-white font-medium transition-all duration-300 hover:bg-white/10 hover:shadow-lg">
                🍖 Main Dishes
            </a>
            
            <a routerLink="/side-dishes"
               routerLinkActive="navbar-active" 
               class="navbar-link px-4 py-2 rounded-lg text-white font-medium transition-all duration-300 hover:bg-white/10 hover:shadow-lg">
                🥗 Side Dishes
            </a>
            
            <a routerLink="/drinks"
               routerLinkActive="navbar-active"
               class="navbar-link px-4 py-2 rounded-lg text-white font-medium transition-all duration-300 hover:bg-white/10 hover:shadow-lg">
                🥤 Drinks
            </a>
        </div>

        <!-- Right Side Controls -->
        <div class="flex items-center space-x-2">
            <!-- Cart Button - Styled like dishes buttons -->
            <div class="relative">
                <a routerLink="/cart"
                   routerLinkActive="navbar-active"
                   class="navbar-link px-4 py-2 rounded-lg text-white font-medium transition-all duration-300 hover:bg-white/10 hover:shadow-lg flex items-center space-x-2">
                    <i class="pi pi-shopping-cart text-lg"></i>
                    <span>Cart</span>
                </a>
                
                <!-- Custom Cart Badge -->
                <span *ngIf="cartCount > 0" 
                      class="absolute -top-2 -right-2 bg-yellow-400 text-red-800 text-xs font-bold rounded-full min-w-[20px] h-5 flex items-center justify-center px-1 shadow-lg animate-bounce">
                    {{ cartCount }}
                </span>
            </div>

            <!-- Mobile Menu Button -->
            <div class="md:hidden">
                <p-button 
                    icon="pi pi-bars"
                    [text]="true"
                    class="text-white hover:bg-white/10 transition-all duration-300">
                </p-button>
            </div>

            <!-- Dark Mode Toggle - Simple circle -->
            <button 
                (click)="toggleDarkMode()"
                class="w-10 h-10 rounded-full bg-white/10 border border-white/20 backdrop-blur-sm text-white hover:bg-white/20 transition-all duration-300 flex items-center justify-center">
                <i [class]="isDarkMode ? 'pi pi-moon' : 'pi pi-sun'" class="text-sm"></i>
            </button>
        </div>
    </div>
</p-toolbar>

<!-- Spacer to prevent content from going under the fixed navbar -->
<div class="h-20"></div>
