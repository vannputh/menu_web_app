<div class="menu-item-card" (click)="addToCart()" [class.disabled]="disabled">
  <div class="card-image">
    <img [src]="imageSrc" [alt]="title" class="item-image">
  </div>
  
  <div class="card-content">
    <h3 class="item-title" *ngIf="title">{{ title }}</h3>
    <p class="item-price" *ngIf="price > 0">${{ price | number:'1.2-2' }}</p>
    <button class="add-to-cart-btn" *ngIf="!disabled" (click)="addToCart(); $event.stopPropagation()">
      Add to Cart
    </button>
  </div>
</div>
