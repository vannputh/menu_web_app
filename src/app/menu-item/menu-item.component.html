<p-card 
  [styleClass]="disabled ? 'menu-card opacity-60 pointer-events-none' : 'menu-card'"
  (click)="addToCart()">
  
  <!-- Card Header with Image -->
  <ng-template pTemplate="header">
    <div class="relative h-48 w-full overflow-hidden rounded-t-lg">
      <img [src]="imageSrc" 
           [alt]="title" 
           class="w-full h-full object-cover transition-transform duration-300 hover:scale-105 cursor-pointer"
           [class.grayscale]="disabled">
      
      <!-- Overlay for disabled state -->
      <div *ngIf="disabled" 
           class="absolute inset-0 bg-gray-900 bg-opacity-20 flex items-center justify-center">
        <i class="pi pi-lock text-gray-500 text-3xl"></i>
      </div>
    </div>
  </ng-template>

  <!-- Card Content -->
  <div class="p-6 text-center space-y-3 min-h-[120px] flex flex-col justify-between">
    <div class="space-y-2">
      <h3 class="text-lg font-semibold text-gray-900 leading-tight line-clamp-2" *ngIf="title">
        {{ title }}
      </h3>
      
      <p class="text-2xl font-bold text-red-600" *ngIf="price > 0">
        ${{ price | number:'1.2-2' }}
      </p>
    </div>
  </div>

  <!-- Card Footer with Action Button -->
  <ng-template pTemplate="footer">
    <div class="flex justify-center p-4 pt-0">
      <p-button 
        *ngIf="!disabled && price > 0"
        label="Add to Cart" 
        icon="pi pi-shopping-cart"
        (onClick)="addToCart(); $event.stopPropagation()"
        styleClass="w-full bg-red-600 hover:bg-red-700 border-red-600 hover:border-red-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 shadow-md hover:shadow-lg">
      </p-button>
      
      <!-- Placeholder for disabled items -->
      <div *ngIf="disabled || price === 0" 
           class="w-full bg-gray-300 text-gray-500 py-2 px-4 rounded-lg text-center font-semibold">
        Coming Soon
      </div>
    </div>
  </ng-template>
</p-card>
