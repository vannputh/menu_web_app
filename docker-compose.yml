name: kaixin
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
      - MONGO_URI=${MONGO_URI}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NODE_ENV=${NODE_ENV:-production}

  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend
